services:
  - type: web
    name: starconnect
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn myapp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: starconnect-db
          property: connectionString

databases:
  - name: starconnect-db
    databaseName: starconnect
    plan: free