services:
  - type: web
    name: siddikconnect
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: siddikconnect-db
          property: connectionString

databases:
  - name: siddikconnect-db
    databaseName: siddikconnect
    plan: free